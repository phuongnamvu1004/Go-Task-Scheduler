basePath: /
definitions:
  http.errorResponse:
    properties:
      error:
        type: string
    type: object
  http.jobResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      schedule:
        type: string
      status:
        $ref: '#/definitions/job.Status'
      task: {}
      task_type:
        $ref: '#/definitions/task.Type'
      updated_at:
        type: string
    type: object
  http.webhookJobPatch:
    properties:
      name:
        type: string
      schedule:
        type: string
      task:
        $ref: '#/definitions/http.webhookTaskPatch'
    type: object
  http.webhookJobRequest:
    properties:
      name:
        type: string
      schedule:
        type: string
      task:
        $ref: '#/definitions/task.Webhook'
    type: object
  http.webhookTaskPatch:
    properties:
      body:
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        $ref: '#/definitions/task.HTTPMethod'
      url:
        type: string
    type: object
  job.Status:
    enum:
    - active
    - paused
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusPaused
  task.HTTPMethod:
    enum:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    type: string
    x-enum-varnames:
    - MethodGET
    - MethodPOST
    - MethodPUT
    - MethodPATCH
    - MethodDELETE
  task.Type:
    enum:
    - webhook
    type: string
    x-enum-varnames:
    - TypeWebhook
  task.Webhook:
    properties:
      body:
        type: string
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        $ref: '#/definitions/task.HTTPMethod'
      url:
        type: string
    type: object
info:
  contact: {}
  description: Create and manage jobs that run tasks on a schedule.
  title: Go Task Scheduler API
  version: 0.1.0
paths:
  /jobs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.jobResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: List jobs of every task type
      tags:
      - jobs
  /jobs/webhook:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              allOf:
              - $ref: '#/definitions/http.jobResponse'
              - properties:
                  task:
                    $ref: '#/definitions/task.Webhook'
                type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: List webhook jobs
      tags:
      - webhook jobs
    post:
      consumes:
      - application/json
      parameters:
      - description: Webhook job
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/http.webhookJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/http.jobResponse'
            - properties:
                task:
                  $ref: '#/definitions/task.Webhook'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Create a webhook job
      tags:
      - webhook jobs
  /jobs/webhook/{id}:
    delete:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Delete a webhook job
      tags:
      - webhook jobs
    get:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.jobResponse'
            - properties:
                task:
                  $ref: '#/definitions/task.Webhook'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Get a webhook job
      tags:
      - webhook jobs
    put:
      consumes:
      - application/json
      description: 'Partial update: only the fields in the body change, the rest keep
        their current value.'
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/http.webhookJobPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.jobResponse'
            - properties:
                task:
                  $ref: '#/definitions/task.Webhook'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Update a webhook job
      tags:
      - webhook jobs
  /jobs/webhook/{id}/pause:
    post:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.jobResponse'
            - properties:
                task:
                  $ref: '#/definitions/task.Webhook'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Pause a webhook job
      tags:
      - webhook jobs
  /jobs/webhook/{id}/resume:
    post:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.jobResponse'
            - properties:
                task:
                  $ref: '#/definitions/task.Webhook'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.errorResponse'
      summary: Resume a paused webhook job
      tags:
      - webhook jobs
swagger: "2.0"
